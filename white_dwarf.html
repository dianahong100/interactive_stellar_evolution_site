<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Evolution</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
            rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Bootstrap JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script type="module" src="index.js" defer></script>

    <!-- Update custom style sheet link with:  {{url_for('static', filename='pathToFile')}}-->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!--spacing-->
    <br><br><br><br><br><br><br>

    <!--interactive stellar evolution-->
    <div class="container d-flex" id="stellar-evolution-path">
        <div id="step-4">
            <!--intro-->
            <div id="introduction-sequence">
                <!--This story may be over for now, but those layers that it shed are drifting out
                in the vast interstellar medium.-->
                <!--This material will slowly accumulate, and one day, someday, a nebula will form, and the cycle repeats.-->
            </div>

            <!--white dwarf -->
            <div id="white-dwarf">
                <!--image-->

                <!--caption-->
                <p>This star's life is over now that it is a white dwarf, but that is not the case for some white dwarfs. Those in a 
                    binary system, or a system in which the white dwarf and a companion orbit a common center, can go on to produce
                    great astronomical phenomenae. 
                </p>

                <!--temperature slider-->
                <!--if slide to 10, move to main sequence page-->
                <button type="button" id="blow-away" name="BLOW" min="1" max="10" step="1" value="1">
                    <!--OR CHANGE TO A BUTTON / SWITCH-->
            </div>
        </div>

    <!--spacing-->
    <br><br><br><br><br><br><br>

        <!--footer-->
    <footer class="p-5 footer text-light text-center">
        <div class="container d-flex justify-content-center align-items-center gap-3 flex-wrap">
            <h1 class="lead m-0 text-center" style="font-family: sans-serif, Helvetica;">
                New Jersey State Museum
            </h1>
            <a href="#" class="mt-2">
                <img src="images/logos/njsm_logo.png">
            </a>
        </div>
    </footer>


</body>
